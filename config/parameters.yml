# Single source of truth for pipeline parameters.
# Every script in src/ should read from this file rather than hardcoding values,
# so the whole pipeline stays reproducible from one place.
 
domain:
  height_km: 160
  width_km: 130
  resolution_m: 30
  
crs:
  projection: "Lambert Conformal Conic"
  reference_point:
    lat: -44.0
    lon: 42.0
  custom CRS: "Fictional World LCC"
  PROJ string parameter:
    +proj=lcc +lat_1=-44.48 +lat_2=-43.52 +lat_0=-44 +lon_0=42 +x_0=0 +y_0=0 
    +datum=WGS84 +units=m +no_defs
  # "the answer to the ultimate question of life, the universe, and everything,"
  # one-sixth of that span in from each edge lands the standard parallels around -44.48° and -43.52°.
  # north-south extent of the domain (in degrees) is set
 
validation_reference:
  region: "South Island, New Zealand"
  transect: null  # Tappa 2 validated against stations rather than a transect
                  # (see docs/decisions/02_tappa2_climate.md S5); fill in or drop
  stations_used:            # annual normals used as calibration targets
    milford_sound_mm: 6545
    greymouth_mm: 2443
    invercargill_mm: 1035
    queenstown_mm: 909
    dunedin_mm: 724
    christchurch_mm: 612
    timaru_mm: 543
    alexandra_mm: 300       # approximate, NIWA teaching material ("~30 cm")
  data_sources:
    - "NIWA"
    - "WorldClim / CHELSA"
 
terrain:
  # Locked in during Tappa 1 -- see docs/decisions/01_tappa1_terrain.md for
  # full rationale. v3 (in use) = v2's real-DEM-derived texture layer
  # (real_detail_* below) + a fix for a domain-warp folding bug found by
  # visual QA in QGIS after v2 (see decision doc S11 -- warp_amplitude_m
  # and noise_warp_amplitude_m below are the FIXED v3 values, 40% of the
  # v2 values that caused ~35% of the domain to have a folded warp map).
  # the noise_* fields are v1's synthetic-only path, still valid/available
  # but bypassed whenever real_detail_path is set (see decision doc S10d).
  seed: 42
  noise_octaves: 6              # v1 (synthetic) path only -- see note above
  noise_frequency: null         # superseded by noise_base_wavelength_m (25000 m, v1 path only)
  noise_base_wavelength_m: 25000  # v1 path only
  noise_amplitude_m: 200
  noise_plain_octaves: 2        # v1 path only
  persistence: 0.87             # v1 path only; two-band calibrated value (S10b)
  noise_persistence_fine: 0.50  # v1 path only
  noise_crossover_wavelength_m: 4000  # v1 path only
  noise_crossover_width_factor: 3.0   # v1 path only
  lacunarity: 1.75              # used by both paths (also drives the real-detail fine-supplement octaves)
  sea_level_offset_m: 300
  warp_wavelength_m: 15000
  warp_amplitude_m: 2000         # v3 fixed value (was 5000 in v2 -- folded ~35% of the domain, see decision doc S11)
  warp_octaves: 6
  warp_lacunarity: 1.75
  warp_persistence: 0.7
  noise_warp_wavelength_m: 4000
  noise_warp_amplitude_m: 600    # v3 fixed value (was 1500 in v2, same folding issue)
  noise_warp_octaves: 5
  noise_warp_lacunarity: 1.75
  noise_warp_persistence: 0.7
  erosion_iterations: null       # superseded by erosion.max_steps / erosion.n_droplets below
  erosion:
    max_steps: 427
    n_droplets_per_land_cell: 0.3   # v2; v1 used a fixed 300000 (~0.028/land-cell)
    erode_speed: 0.45
    deposit_speed: 0.35
    seed: 1
  # Actual v3 run on disk (data/processed/dem_v3_run_meta.json). These
  # supersede the figures in decision doc 01 S11c, which predate the
  # amplitude_zone -> plateau skeleton edit and the re-run that followed.
  run_v3:
    shape: [5334, 4334]
    elevation_min_m: -945.6
    elevation_max_m: 3595.8
    land_fraction: 0.4764
    n_droplets: 3316162
  spine_path: null       # superseded by data/input/terrain_ridges.geojson + terrain_zones.geojson (hand-authored skeleton, see decision doc S1)
  real_detail:            # v2 real-DEM texture graft (decision doc S10c-e) -- not used if path is null
    path: "data/real_detail/piemonte_detail_15km_detrend.npy"
    source: "SRTM GL3, Piemonte/western Alps (user-supplied SRTMGL3.tiff)"
    xmin: -65000
    ymax: 80000
    cellsize_m: 92.767
    fine_supplement_weight: 0.15
    fine_min_wavelength_m: 60.0
 
climate:
  # Locked in during Tappa 2 -- see docs/decisions/02_tappa2_climate.md.
  # Regenerate everything with: python run_tappa2_climate.py  (~19 s)
  working_resolution_m: 120       # 4x block-mean of the 30 m DEM (S2)
  months: 12

  temperature:
    # NOT the -6.5 C/km standard atmosphere this file used to carry: 5.0 is
    # Norton (1985), 301 NZ climate stations, and is the right value for a
    # maritime mid-latitude range. The two differ by 5.4 C at the summit.
    lapse_rate_c_per_1000m: -5.0
    lapse_seasonal_amplitude_c_per_1000m: 0.3   # steepest in Feb; see S3a
    lapse_peak_month: 2.0
    t_ref_sea_level_c: 11.5        # annual mean at sea level at lat_ref
    lat_ref_deg: -44.0
    dt_dlat_c_per_deg: 0.70        # ~1.0 C across the domain's 1.437 deg span
    amplitude_coastal_c: 4.0       # half the annual range at the shore
    amplitude_inland_c: 7.0        # asymptote; only ~0.63 of the way there at 29.9 km
    continentality_scale_km: 30.0  # 1 - exp(-d/L); d via distance_transform_edt
    peak_month_coastal: 2.2
    peak_month_shift_inland: 0.9

  precipitation:
    model: "Smith & Barstad (2004) linear orographic theory"
    wind_direction_from_deg: 250.0   # WSW. Set by latitude (44 S westerly
                                     # belt), then chosen within the western
                                     # quadrant for orographic effectiveness
                                     # against the skeleton -- 0.77 overall,
                                     # no ridge below 0.67. See S1.
    wind_speed_ms: 12.0
    wind_speed_seasonal_amplitude_ms: 2.0
    wind_peak_month: 8.0             # SH jet equatorward in winter
    nm_moist_stability_per_s: 0.005
    tau_c_s: 1000.0                  # cloud water -> hydrometeor conversion
    tau_f_s: 1000.0                  # hydrometeor fallout
    orographic_duty_cycle: 0.07      # THE calibrated parameter: S&B is an
                                     # event model, this is the fraction of
                                     # the month the modelled flow is active
    background_precip_mm_per_month: 60.0   # non-orographic, additive
    lee_floor_fraction: 0.45         # cap on leeward suppression (S4d)
    fft_pad_km: 40.0
    # Cw and Hw are NOT free parameters -- both are derived per month from
    # the temperature model's own sea-level temperature via Clausius-
    # Clapeyron and the moist adiabat (S4c).

  snow:
    # Locked in during Tappa 3 -- see docs/decisions/03_tappa3_snow.md.
    # Regenerate with: python run_tappa3_snow.py  (~18 s)
    t50_snow_rain_c: 1.0        # 50% rain/snow threshold, dry-bulb air temp.
                                 # Jennings et al. (2018), Nat. Commun. 9:1148
    sigma_day_c: 3.0             # assumed day-to-day (synoptic) std dev of
                                 # daily temp around the monthly mean -- drives
                                 # both the rain/snow transition sharpness and
                                 # the positive-degree-day estimate. NOT
                                 # independently verified for this world's NZ
                                 # reference region (S1); open to recalibration.
    degree_day_factor_mm_per_c_day: 4.5   # snow melt, mm w.e. per positive-
                                 # degree-day. Hock (2003) J. Hydrol. 282,
                                 # Table 1: observed snow DDFs cluster 3.2-7.6
    min_snow_month_mm: 5.0       # floor for a month to count in months-with-snow
    # Permanent snow = annual (snow accumulation - PDD melt) >= 0, a one-year
    # steady-state ELA proxy -- NOT a real multi-year glacier mass-balance
    # model (no ice flow, refreezing, or wind redistribution). See S6.

hydrology:
  # Locked in during Tappa 4 -- see docs/decisions/04_tappa4_hydrology.md.
  # Regenerate with: python run_tappa4_hydrology.py  (~440 s)
  # Runs at the DEM's native 30 m grid, NOT the 120 m climate working
  # resolution (S0) -- drainage-network topology is resolution-sensitive
  # in a way temperature/precipitation are not.
  resolution_m: 30
  algorithm: "Priority-Flood+Epsilon (Barnes, Lehman & Mulla 2014) -- combined
              depression-fill + D8 direction in one pass; GRASS r.watershed /
              r.stream.extract unavailable in this sandbox (S1)"
  priority_flood_epsilon_m: 0.0001
  flow_weighting: "precipitation-weighted (Tappa 2 annual precip, resampled
                    120m -> 30m); plain cell-count area also computed for
                    stream-network topology (S0, S2, S3)"
  stream_threshold_km2: 0.3   # contributing-area threshold, NOT area x slope^2
                               # (tried, rejected for this terrain -- S2).
                               # Visually/drainage-density calibrated, not an
                               # independently verified NZ figure (S2, S6).
  lake_fill_threshold_m: 2.0  # depression-fill floor for the lake mask (S4)
  major_basin_min_km2: 20.0   # display aggregation only, not a data cut (S5)
  # Actual run on disk (data/processed/hydrology/tappa4_hydrology_meta.json):
  run_v1:
    land_area_km2: 9912.5217
    max_contributing_area_km2: 751.1193
    max_discharge_proxy_m3s: 103.128
    drainage_density_km_per_km2: 1.1418
    lake_area_km2: 176.4846
    n_basins_major: 54

  # Addendum: seasonal / intermittent flow -- see
  # docs/decisions/04_tappa4_hydrology.md S12.
  # Regenerate with: python run_tappa4_seasonal.py  (~520 s, dominated by
  # an in-memory re-run of the priority-flood pass -- do NOT reconstruct
  # from filled_dem_30m.npy, it was saved float32 and silently corrupts
  # the strict-descent ordering at this DEM's elevation range, S12).
  flowing_fraction_of_annual_mean: 0.10  # relative, per-cell threshold
  spinup_cycles: 3                        # snowpack spin-up cycles before
                                            # the kept simulation year
  # Actual run on disk (data/processed/hydrology/seasonal/tappa4_seasonal_meta.json):
  seasonal_run_v1:
    n_stream_cells: 377281
    perennial_cells: 319305
    perennial_fraction: 0.8463
    intermittent_cells: 57976
    intermittent_fraction: 0.1537
    min_months_flowing_observed: 7   # nothing classifies as more ephemeral
                                       # than this -- see S12 limitations
                                       # (no groundwater/baseflow, no
                                       # transmission losses)

biomes:
  # Locked in during Tappa 5 -- see docs/decisions/05_tappa5_biomes.md.
  # Regenerate with: python run_tappa5_biomes.py  (~15 s)
  working_resolution_m: 120   # matches Tappa 2/3's climate grid, not the 30 m DEM
  method: "Holdridge Life Zones (Holdridge 1967), general implementation in
           src/biomes/holdridge.py, fine-tuned to this world in
           src/biomes/world_biomes.py -- NOT Holdridge's stock moisture bands,
           see below."
  holdridge:
    pet_constant_mm_per_c: 58.93   # PET = 58.93 * biotemperature; confirmed
                                     # against Aguirre et al. (2025, Sci. Data)
    biotemperature_clip_c: [0.0, 30.0]
    belt_boundaries_c: [1.5, 3.0, 6.0, 12.0, 18.0, 24.0]   # Polar..Tropical
    # NOT used: Holdridge's own global humidity-province PET-ratio bands
    # (0.5/1/2/4/8/16/32). Applied literally to this world's climate stack,
    # NO land cell clears ratio >= 4 (Semiarid) -- the driest cell on record
    # (324 mm/yr, same cell validated against real Alexandra's ~300 mm in
    # Tappa 2-4) only reaches ratio ~2.1 ("Subhumid"). Structural, not a bug:
    # PET is linear in biotemperature, which never exceeds 12 C here, capping
    # PET near 700 mm/yr even at the driest, lowest-elevation cell. Taken at
    # face value this would erase the entire windward/leeward moisture
    # contrast Tappa 2-4 validated (5.6:1 precip ratio, 1136 m ELA
    # differential, 5.9:1 discharge ratio). See world-specific fix below.
  world_specific:
    # The PET ratio is kept (it still correctly ranks wet vs dry cells) but
    # rebinned by THIS world's own land-cell percentiles, the same move
    # Tappa 3/4 already made for their windward/leeward split, rather than
    # Holdridge's desert-calibrated absolute bins.
    moisture_tiers: 3   # Wet / Moist / Dry, terciles of land PET ratio
                         # (a first draft used quartiles incl. "Superwet" --
                         # rejected, see decision doc: produced an unreadable
                         # 96 km2 sliver and a 4-way green palette collision)
    belts_split_by_moisture: ["Boreal", "Cool Temperate"]
    belts_not_split: ["Polar", "Subpolar"]   # negligible/zero "dry" area at
                                               # these belts; splitting adds
                                               # categories without adding
                                               # legible distinctions
    warm_temperate_folded_into: "Cool Temperate"   # ~0.06 km2, 4 cells, right
                                                     # at the 12 C belt edge
    permanent_snow_source: "Tappa 3 mass-balance mask (annual_mass_balance
                             balance_mm >= 0), NOT Holdridge's own Polar belt
                             -- Polar (Tb<1.5C) is 1243 km2, ~30% bigger than
                             the mass-balance area (960 km2, 68% cell
                             overlap): the same naive-temperature-threshold
                             error Tappa 2/3 already caught once."
  # Actual run on disk (data/processed/biomes/tappa5_biomes_meta.json):
  run_v1:
    moisture_tercile_pet_ratio_edges: [0.1184, 0.5360]
    biome_area_km2:
      permanent_snow_and_ice: 960.2
      alpine_fellfield: 396.0
      alpine_tundra: 616.5
      subalpine_wet_forest: 942.4
      subalpine_woodland: 167.2
      subalpine_dry_scrub: 335.1
      temperate_forest: 689.8
      woodland_shrubland: 2834.8
      lowland_steppe_grassland: 2962.2
    validation_vs_nz:
      dry_scrub_km2_windward_side: 0.0
      dry_scrub_km2_leeward_side: 335.1   # leeward-only: zero windward cells
      leeward_dry_tercile_lowland_steppe_grassland_fraction: 0.7339
      windward_wet_tercile_lowland_steppe_grassland_fraction: 0.0

suitability:
  # Locked in during Tappa 6 -- see docs/decisions/06_tappa6_suitability.md.
  # Regenerate with, in order: run_tappa6_core_metrics.py, run_tappa6_solar.py,
  # run_tappa6_biome_suitability.py (+_povo_livre), run_tappa6_composite.py,
  # run_tappa6_site_selection.py
  working_resolution_m: 120
  nucleo:
    slope_gentle_pct: 5.0
    slope_hard_limit_pct: 30.0    # placeholder generic thresholds, not
                                    # world-calibrated -- see decision doc S1
    water_gentle_km: 0.5
    water_hard_limit_km: 5.0       # near-flat in practice, dense stream network
    solar_method: "FAO-56 clear-sky Rso x 16-direction/10km horizon-shaded
                    tilted/horizontal ratio, 12 mid-month days -- see S2"
  biome_suitability:                # hand-scored, not derived (S3)
    circulo:
      permanent_snow_ice: 0.00
      alpine_fellfield: 0.05
      alpine_tundra: 0.20
      subalpine_dry_scrub: 0.30
      subalpine_woodland: 0.45
      subalpine_wet_forest: 0.55
      temperate_forest: 0.85
      woodland_shrubland: 0.90
      lowland_steppe_grassland: 1.00
    povo_livre:                     # S4 -- mirrors only the forest/grassland
      temperate_forest: 1.00        # endpoints, other 7 classes identical to
      lowland_steppe_grassland: 0.85 # circulo above
  exclusao:
    povo_silencioso_hard_buffer_km: 5.0
    povo_silencioso_soft_buffer_km: 15.0   # placeholder, no lore distance specified
    applied_to_both_composites: true        # default choice, not confirmed (S5)
  composite_weights:                # S5 -- two separate composites
    circulo:    {slope: 0.20, water: 0.05, agriculture: 0.25, solar: 0.20, biome: 0.30}
    povo_livre: {slope: 0.10, water: 0.05, agriculture: 0.10, solar: 0.15, biome: 0.60}
  site_selection:
    # S6-8 -- greedy, largest-population-first, square-window approximation
    # of a circular footprint (Tappa 8's job to actually lay out)
    density_ppl_km2: 4000.0          # adjustable placeholder
    buffer_factor: 2.0                # footprint non-overlap, straight-line km
    min_land_fraction: 0.98
    circulos: "4 large (40k/35k/25k/20k) + 5 medium (2k each) + 8 small
                (625 each, split evenly from a 5,000 combined total -- only
                figure the scenario specified for the smallest group)"
    cost_distance:
      # S7 -- replaced an earlier straight-line tier_min_distance (60km
      # large-large / 25km medium-medium) after two real design corrections
      # (round 1: uniform-against-everyone collapsed placement to 5/17,
      # fixed by scoping to same-tier pairs; round 3: switched the metric
      # itself from straight-line km to cost-distance hours)
      friction_model: "Tobler's hiking function on land (6*exp(-3.5*|slope_ratio+0.05|)
                        km/h, ~5.04 km/h flat, signed slope from a 120m
                        block-MEAN DEM), flat boat speed on any non-land edge"
      boat_speed_kmh: 6.0             # NOTE: >= Tobler's flat pace, so sea is
                                       # NOT currently a real barrier in this
                                       # model -- see decision doc S7
      tier_min_hours:
        large-large: 12.0             # ceiling ~15h
        medium-medium: 8.0            # ceiling ~12-14h
        small-small: 2.5              # user's own pick, no ceiling found <=8h
        large-medium: 6.0             # added round 4 (S8), ceiling ~10h
    lake_exclusion: "land_mask & ~lake_mask_120m (Tappa 4's lake_mask.npy,
                      block-ANY downsampled), added round 4 (S8) after 7/17
                      sites were found sitting inside lakes -- used for ALL
                      site-selection computations, not a post-hoc filter"
  # Actual run on disk (data/processed/suitability/tappa6_site_selection_meta.json):
  run_v1:
    n_placed: 17
    n_failed_to_place: 0
    n_sites_on_lake: 0
    n_min_distance_violations: 0
    biome_distribution: {grassland: 13, temperate_forest: 2, woodland_shrubland: 2}
    one_large_circulo_on_sw_island: true   # Circulo_D_20k, label 135, ~794 km2

# Tappa 7 (regional scenario deepening) ran and CLOSED -- fauna build-out
# delivered (see docs/decisions/07_tappa7_regional_scenario.md); its other
# five domains (geology/lithology, caves, resources, dangerous creatures,
# dangerous seas, transportation) stayed decision-only and are now scoped
# into a locked roadmap, see that doc's S9: Tappa 8 (geomorphology), Tappa 9
# (transports), Tappa 10 (interactions). Urban zoom is no longer "Tappa 8"
# -- retired from the Tappa sequence, now its own untethered Urban Scale
# track (different technique/resolution from the macro-domain Tappas, not
# just a different topic).
#
# Tappa 8 (geomorphology) -- FIRST STEP CLOSED (lithology + caves + jade/
# pounamu resource; see docs/decisions/08_tappa8_geomorphology.md). Dangerous
# creatures/conflict zones, dangerous seas, and transportation (the other
# three domains folded into "Tappa 8" by S9) are still open. Criteria not
# yet defined for those remaining domains or for Tappa 9-10; Urban Scale's
# technique was already agreed back at Tappa 0.

geomorphology:
  # Locked in during Tappa 8 (first step) -- see
  # docs/decisions/08_tappa8_geomorphology.md. Regenerate with, in order:
  # run_tappa8_lithology_v5.py, then run_tappa8_caves_v3.py (talus/sea/
  # glacier-moulin are unchanged since v2/v1 and don't need re-running --
  # only lava tubes consume the lithology raster).
  lithology_v5:
    relief_window_m: 2000.0
    elev_percentile: 60.0             # mainland-land floor for schist eligibility (AND branch)
    relief_schist_percentile: 75.0    # mainland-land floor, AND'd with elevation
    relief_greywacke_percentile: 50.0 # mainland-land floor for greywacke (flank, not schist)
    high_elev_percentile: 90.0        # OR branch: elevation alone above this qualifies for
                                        # schist regardless of relief -- fixes rounded-summit
                                        # crest points (S2 of the decision doc)
    island_relief_percentile: 25.0    # island's OWN relief population; below -> basin_fill
                                        # (flat isthmus/apron margin), at/above -> volcanic
    # all five values above are first-pass placeholders, calibrated as percentiles of this
    # world's own elevation/relief distributions, not independently tuned against anything
    # external -- see decision doc S7.
  jade:
    n_pods: 10
    min_separation_km: 5.0
    radius_range_m: [300.0, 800.0]
    grade_percentile_threshold: 80.0
    seed: 13
  caves:
    # v1/v2 approved before this session; only lava_tube was re-run this session
    # (against lithology_v5 instead of lithology_v2) -- see decision doc S4.
    steep_threshold_pct_talus_sea: 20.14   # p75 of mainland land slope
    glacier_moulin:
      snow_mask_local_slope_p75_pct: 22.55
      margin_depth_threshold_km: 2.48       # median within the snow mask
    lava_tube:
      vent_weight_threshold: 0.1
      gentle_slope_threshold_pct: 8.94      # local p25 within lithology_v5's (smaller)
                                              # volcanic zone -- was 6.17 under lithology_v2,
                                              # rose because removing the flat island margin
                                              # from the population makes it steeper on average
    talus_stream_buffer_km: 0.5
    sea_coastal_buffer_km: 0.5
