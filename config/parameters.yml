# Single source of truth for pipeline parameters.
# Every script in src/ should read from this file rather than hardcoding values,
# so the whole pipeline stays reproducible from one place.
 
domain:
  height_km: 160
  width_km: 130
  resolution_m: 30
  
crs:
  projection: "Lambert Conformal Conic"
  reference_point:
    lat: -44.0
    lon: 42.0
  custom CRS: "Fictional World LCC"
  PROJ string parameter:
    +proj=lcc +lat_1=-44.48 +lat_2=-43.52 +lat_0=-44 +lon_0=42 +x_0=0 +y_0=0 
    +datum=WGS84 +units=m +no_defs
  # "the answer to the ultimate question of life, the universe, and everything,"
  # one-sixth of that span in from each edge lands the standard parallels around -44.48° and -43.52°.
  # north-south extent of the domain (in degrees) is set
 
validation_reference:
  region: "South Island, New Zealand"
  transect: null  # Tappa 2 validated against stations rather than a transect
                  # (see docs/decisions/02_tappa2_climate.md S5); fill in or drop
  stations_used:            # annual normals used as calibration targets
    milford_sound_mm: 6545
    greymouth_mm: 2443
    invercargill_mm: 1035
    queenstown_mm: 909
    dunedin_mm: 724
    christchurch_mm: 612
    timaru_mm: 543
    alexandra_mm: 300       # approximate, NIWA teaching material ("~30 cm")
  data_sources:
    - "NIWA"
    - "WorldClim / CHELSA"
 
terrain:
  # Locked in during Tappa 1 -- see docs/decisions/01_tappa1_terrain.md for
  # full rationale. v3 (in use) = v2's real-DEM-derived texture layer
  # (real_detail_* below) + a fix for a domain-warp folding bug found by
  # visual QA in QGIS after v2 (see decision doc S11 -- warp_amplitude_m
  # and noise_warp_amplitude_m below are the FIXED v3 values, 40% of the
  # v2 values that caused ~35% of the domain to have a folded warp map).
  # the noise_* fields are v1's synthetic-only path, still valid/available
  # but bypassed whenever real_detail_path is set (see decision doc S10d).
  seed: 42
  noise_octaves: 6              # v1 (synthetic) path only -- see note above
  noise_frequency: null         # superseded by noise_base_wavelength_m (25000 m, v1 path only)
  noise_base_wavelength_m: 25000  # v1 path only
  noise_amplitude_m: 200
  noise_plain_octaves: 2        # v1 path only
  persistence: 0.87             # v1 path only; two-band calibrated value (S10b)
  noise_persistence_fine: 0.50  # v1 path only
  noise_crossover_wavelength_m: 4000  # v1 path only
  noise_crossover_width_factor: 3.0   # v1 path only
  lacunarity: 1.75              # used by both paths (also drives the real-detail fine-supplement octaves)
  sea_level_offset_m: 300
  warp_wavelength_m: 15000
  warp_amplitude_m: 2000         # v3 fixed value (was 5000 in v2 -- folded ~35% of the domain, see decision doc S11)
  warp_octaves: 6
  warp_lacunarity: 1.75
  warp_persistence: 0.7
  noise_warp_wavelength_m: 4000
  noise_warp_amplitude_m: 600    # v3 fixed value (was 1500 in v2, same folding issue)
  noise_warp_octaves: 5
  noise_warp_lacunarity: 1.75
  noise_warp_persistence: 0.7
  erosion_iterations: null       # superseded by erosion.max_steps / erosion.n_droplets below
  erosion:
    max_steps: 427
    n_droplets_per_land_cell: 0.3   # v2; v1 used a fixed 300000 (~0.028/land-cell)
    erode_speed: 0.45
    deposit_speed: 0.35
    seed: 1
  # Actual v3 run on disk (data/processed/dem_v3_run_meta.json). These
  # supersede the figures in decision doc 01 S11c, which predate the
  # amplitude_zone -> plateau skeleton edit and the re-run that followed.
  run_v3:
    shape: [5334, 4334]
    elevation_min_m: -945.6
    elevation_max_m: 3595.8
    land_fraction: 0.4764
    n_droplets: 3316162
  spine_path: null       # superseded by data/input/terrain_ridges.geojson + terrain_zones.geojson (hand-authored skeleton, see decision doc S1)
  real_detail:            # v2 real-DEM texture graft (decision doc S10c-e) -- not used if path is null
    path: "data/real_detail/piemonte_detail_15km_detrend.npy"
    source: "SRTM GL3, Piemonte/western Alps (user-supplied SRTMGL3.tiff)"
    xmin: -65000
    ymax: 80000
    cellsize_m: 92.767
    fine_supplement_weight: 0.15
    fine_min_wavelength_m: 60.0
 
climate:
  # Locked in during Tappa 2 -- see docs/decisions/02_tappa2_climate.md.
  # Regenerate everything with: python run_tappa2_climate.py  (~19 s)
  working_resolution_m: 120       # 4x block-mean of the 30 m DEM (S2)
  months: 12

  temperature:
    # NOT the -6.5 C/km standard atmosphere this file used to carry: 5.0 is
    # Norton (1985), 301 NZ climate stations, and is the right value for a
    # maritime mid-latitude range. The two differ by 5.4 C at the summit.
    lapse_rate_c_per_1000m: -5.0
    lapse_seasonal_amplitude_c_per_1000m: 0.3   # steepest in Feb; see S3a
    lapse_peak_month: 2.0
    t_ref_sea_level_c: 11.5        # annual mean at sea level at lat_ref
    lat_ref_deg: -44.0
    dt_dlat_c_per_deg: 0.70        # ~1.0 C across the domain's 1.437 deg span
    amplitude_coastal_c: 4.0       # half the annual range at the shore
    amplitude_inland_c: 7.0        # asymptote; only ~0.63 of the way there at 29.9 km
    continentality_scale_km: 30.0  # 1 - exp(-d/L); d via distance_transform_edt
    peak_month_coastal: 2.2
    peak_month_shift_inland: 0.9

  precipitation:
    model: "Smith & Barstad (2004) linear orographic theory"
    wind_direction_from_deg: 250.0   # WSW. Set by latitude (44 S westerly
                                     # belt), then chosen within the western
                                     # quadrant for orographic effectiveness
                                     # against the skeleton -- 0.77 overall,
                                     # no ridge below 0.67. See S1.
    wind_speed_ms: 12.0
    wind_speed_seasonal_amplitude_ms: 2.0
    wind_peak_month: 8.0             # SH jet equatorward in winter
    nm_moist_stability_per_s: 0.005
    tau_c_s: 1000.0                  # cloud water -> hydrometeor conversion
    tau_f_s: 1000.0                  # hydrometeor fallout
    orographic_duty_cycle: 0.07      # THE calibrated parameter: S&B is an
                                     # event model, this is the fraction of
                                     # the month the modelled flow is active
    background_precip_mm_per_month: 60.0   # non-orographic, additive
    lee_floor_fraction: 0.45         # cap on leeward suppression (S4d)
    fft_pad_km: 40.0
    # Cw and Hw are NOT free parameters -- both are derived per month from
    # the temperature model's own sea-level temperature via Clausius-
    # Clapeyron and the moist adiabat (S4c).

  snow:
    # Locked in during Tappa 3 -- see docs/decisions/03_tappa3_snow.md.
    # Regenerate with: python run_tappa3_snow.py  (~18 s)
    t50_snow_rain_c: 1.0        # 50% rain/snow threshold, dry-bulb air temp.
                                 # Jennings et al. (2018), Nat. Commun. 9:1148
    sigma_day_c: 3.0             # assumed day-to-day (synoptic) std dev of
                                 # daily temp around the monthly mean -- drives
                                 # both the rain/snow transition sharpness and
                                 # the positive-degree-day estimate. NOT
                                 # independently verified for this world's NZ
                                 # reference region (S1); open to recalibration.
    degree_day_factor_mm_per_c_day: 4.5   # snow melt, mm w.e. per positive-
                                 # degree-day. Hock (2003) J. Hydrol. 282,
                                 # Table 1: observed snow DDFs cluster 3.2-7.6
    min_snow_month_mm: 5.0       # floor for a month to count in months-with-snow
    # Permanent snow = annual (snow accumulation - PDD melt) >= 0, a one-year
    # steady-state ELA proxy -- NOT a real multi-year glacier mass-balance
    # model (no ice flow, refreezing, or wind redistribution). See S6.

# Tappa 6 (suitability) and Tappa 7 (urban zoom) intentionally left empty —
# criteria not yet defined.
